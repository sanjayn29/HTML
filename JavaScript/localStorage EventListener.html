<!DOCTYPE html>
<html>
    <head>
        <title>Local Storage Counter by EventListener</title>
        <style>
            button{
                font-size: 15px;
                padding: 10px;
                width: 150px;
            }
        </style>
    </head>
    <body>
        <center>
        <h1>Local Storage Counter by EventListener</h1>
        <p id="ans" style="font-size:80px;">0</p>        
        <button type="button" id="inc">Increase </button><br><br>
        <button type="button" id="dec">Decrease</button><br><br>
        <button type="button" id="reset">Reset</button><br><br>
        <button type="button" id="save">Save the Value</button><br><br>
        <button type="button" id="load">Load the Value</button><br><br>
        </center>
        <script src="EventListener.js"></script>
    </body>
</html>
