<!DOCTYPE html>
<html>
    <head>
        <title>Functions</title>
        <script>
            function myfunction(){
                document.getElementById("demo").innerHTML="Function is Called";
            }
        </script>
    </head>
    <body>
        <h2>My Function</h2>
        <p id="demo"></p>
        <button type="button" onclick="myfunction()">Click to Call the Function</button>        
    </body>
</html>
